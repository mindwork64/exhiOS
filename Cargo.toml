[workspace]
members = ["exhi-abi", "exhi-elf", "exhi-boot", "exhi-kernel", "exhi-memory"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
uefi = { version = "0.41.0", default-features = false, features = ["panic_handler", "alloc", "global_allocator"] }
exhi-abi = { path = "exhi-abi" }
exhi-elf = { path = "exhi-elf" }
exhi-memory = { path = "exhi-memory" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
