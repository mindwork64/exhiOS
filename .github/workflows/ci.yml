name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep in-progress self-hosted validation alive; queue newer pushes.
  cancel-in-progress: false

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    # Never execute code from an untrusted fork on the self-hosted machine.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Add Cargo bin directory to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate self-hosted build dependencies
        run: |
          for tool in rustup cargo readelf; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required self-hosted runner tool: $tool" >&2
              exit 1
            fi
          done

      - name: Install Rust targets
        run: rustup target add x86_64-unknown-uefi x86_64-unknown-none

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Validate build and QEMU shell scripts
        run: bash -n scripts/build.sh scripts/run-qemu.sh

      - name: Test shared ABI
        run: cargo test -p exhi-abi

      - name: Test ELF parser
        run: cargo test -p exhi-elf

      - name: Test physical memory allocator
        run: cargo test -p exhi-memory

      - name: Test kernel heap allocator
        run: cargo test -p exhi-heap

      - name: Test framebuffer console
        run: cargo test -p exhi-console

      - name: Test keyboard input queue and Set 1 decoder
        run: cargo test -p exhi-input

      - name: Test driver registry
        run: cargo test -p exhi-driver

      - name: Test task scheduler core
        run: cargo test -p exhi-task

      - name: Test syscall dispatcher
        run: cargo test -p exhi-syscall

      - name: Test libexhi user syscall wrappers
        run: cargo test -p libexhi

      - name: Build first user process ELF
        run: cargo build -p exhi-init --target x86_64-unknown-none

      - name: Verify fixed-address init image
        run: |
          LC_ALL=C readelf -h target/x86_64-unknown-none/debug/exhi-init
          LC_ALL=C readelf -h target/x86_64-unknown-none/debug/exhi-init | grep -Eq 'Type:[[:space:]]+EXEC[[:space:]]+\(Executable file\)'

      - name: Test VFS and RAMFS
        run: cargo test -p exhi-vfs

      - name: Build UEFI application
        run: cargo build -p exhi-boot --target x86_64-unknown-uefi

      - name: Build kernel ELF
        run: cargo build -p exhi-kernel --target x86_64-unknown-none

      - name: Build kernel exception smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features exception-smoke-test

      - name: Build kernel VFS/RAMFS smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features vfs-smoke-test

      - name: Build kernel QEMU debug-exit variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features qemu-debug-exit-smoke-test

      - name: Build kernel interactive serial RX variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features serial-rx-smoke-test

      - name: Build kernel PIT timer smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features qemu-debug-exit-smoke-test,timer-smoke-test

      - name: Build kernel PS/2 keyboard smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features keyboard-smoke-test

      - name: Build kernel driver registry smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features driver-registry-smoke-test

      - name: Build kernel context-switch smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features context-switch-smoke-test

      - name: Build kernel task runtime-accounting smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features task-accounting-smoke-test

      - name: Build kernel timer-driven preemption smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features timer-preemption-smoke-test

      - name: Build kernel preemptive task-exit smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features preemptive-task-exit-smoke-test

      - name: Build kernel paging rollback smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features paging-rollback-smoke-test

      - name: Build kernel Ring 3 smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features ring3-smoke-test

      - name: Build kernel Ring 3 supervisor-fault smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features ring3-supervisor-fault-smoke-test

      - name: Build kernel Ring 3 syscall smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features ring3-syscall-smoke-test

      - name: Build kernel user-pointer validation smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features user-pointer-range-smoke-test

      - name: Build kernel safe user-copy smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features user-copy-smoke-test

      - name: Build kernel user-task lifecycle smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features user-task-lifecycle-smoke-test

      - name: Verify fixed-address kernel image
        run: |
          LC_ALL=C readelf -h target/x86_64-unknown-none/debug/exhi-kernel
          LC_ALL=C readelf -h target/x86_64-unknown-none/debug/exhi-kernel | grep -Eq 'Type:[[:space:]]+EXEC[[:space:]]+\(Executable file\)'

  qemu-smoke-test:
    name: QEMU runtime smoke test
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Add Cargo bin directory to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate self-hosted QEMU dependencies
        run: |
          for tool in rustup cargo readelf qemu-system-x86_64 sgdisk mformat mmd mcopy python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required self-hosted runner tool: $tool" >&2
              exit 1
            fi
          done

      - name: Run headless UEFI and kernel smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless VFS/RAMFS file and directory smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_VFS_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless page-table CR3 rollback smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_PAGING_ROLLBACK_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless PIT IRQ0 timer smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_TIMER_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless PS/2 keyboard IRQ1 input smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_KEYBOARD_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless driver registry smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_DRIVER_REGISTRY_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless cooperative context-switch smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_CONTEXT_SWITCH_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless PIT-backed cooperative task runtime-accounting smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_TASK_ACCOUNTING_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless PIT timer-driven task preemption smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_TIMER_PREEMPTION_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless preemptive task-exit lifecycle smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_PREEMPTIVE_TASK_EXIT_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless idle-context and timed task wake-up smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_IDLE_WAKEUP_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless Ring 3 entry and exception-return smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_RING3_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless Ring 3 supervisor-only access fault smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_RING3_SUPERVISOR_FAULT_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless Ring 3 syscall entry and return smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_RING3_SYSCALL_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless user-pointer range validation smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_USER_POINTER_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless safe user-copy smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_USER_COPY_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh

      - name: Run headless two-user-task lifecycle smoke test
        run: EXHIOS_QEMU_EXIT_TEST=1 EXHIOS_USER_TASK_LIFECYCLE_TEST=1 EXHIOS_HEADLESS=1 ./scripts/run-qemu.sh
