name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ELF inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Install Rust targets
        run: rustup target add x86_64-unknown-uefi x86_64-unknown-none

      - name: Test shared ABI
        run: cargo test -p exhi-abi

      - name: Test ELF parser
        run: cargo test -p exhi-elf

      - name: Build UEFI application
        run: cargo build -p exhi-boot --target x86_64-unknown-uefi

      - name: Build kernel ELF
        run: cargo build -p exhi-kernel --target x86_64-unknown-none

      - name: Build kernel exception smoke-test variant
        run: cargo build -p exhi-kernel --target x86_64-unknown-none --features exception-smoke-test

      - name: Verify fixed-address kernel image
        run: |
          readelf -h target/x86_64-unknown-none/debug/exhi-kernel
          readelf -h target/x86_64-unknown-none/debug/exhi-kernel | grep -Eq 'Type:[[:space:]]+EXEC[[:space:]]+\(Executable file\)'
