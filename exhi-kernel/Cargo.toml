[package]
name = "exhi-kernel"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
exception-smoke-test = []
qemu-debug-exit-smoke-test = []
serial-rx-smoke-test = []
timer-smoke-test = []
keyboard-smoke-test = ["qemu-debug-exit-smoke-test"]
driver-registry-smoke-test = ["qemu-debug-exit-smoke-test"]
context-switch-smoke-test = ["qemu-debug-exit-smoke-test"]
task-accounting-smoke-test = ["qemu-debug-exit-smoke-test"]
timer-preemption-smoke-test = ["qemu-debug-exit-smoke-test"]
preemptive-task-exit-smoke-test = ["timer-preemption-smoke-test"]
idle-wakeup-smoke-test = ["timer-preemption-smoke-test"]
ring3-smoke-test = ["timer-preemption-smoke-test"]
ring3-supervisor-fault-smoke-test = ["ring3-smoke-test"]

[[bin]]
name = "exhi-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
exhi-abi.workspace = true
exhi-memory.workspace = true
exhi-heap.workspace = true
exhi-console.workspace = true
exhi-input.workspace = true
exhi-driver.workspace = true
exhi-task.workspace = true
