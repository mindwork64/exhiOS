[package]
name = "exhi-kernel"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
exception-smoke-test = []
qemu-debug-exit-smoke-test = []
serial-rx-smoke-test = []
timer-smoke-test = []
keyboard-smoke-test = ["qemu-debug-exit-smoke-test"]
